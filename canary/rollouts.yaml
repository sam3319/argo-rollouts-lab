apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollout-canary
  namespace: argo-rollouts
spec:
  replicas: 5
  
  selector:
    matchLabels:
      app: nginx-canary

  template:
    metadata:
      labels:
        app: nginx-canary
    spec:
      containers:
        - name: nginx
          image: docker.io/sam3319/nginx-image-lab:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 60
        - pause:
            duration: 2m
        - setWeight: 100
